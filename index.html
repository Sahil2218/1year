<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#ffd6dd" />
  <title>A Secret Message for Shreyadino 💌</title>
  <link rel="stylesheet" href="style.css" />
  <script defer src="script.js"></script>
</head>
<body>
  <main class="scene" aria-label="Secret apology message from sahildino to shreyadino">
    <div class="background-dinos" aria-hidden="true">
      <span>🦖</span><span>💕</span><span>🦕</span>
    </div>

    <header class="heading">
      <p class="eyebrow">Special Delivery</p>
      <h1>A secret mail for my love dino</h1>
      <p class="subtext">Tap the envelope to open your tiny apology letter 💗</p>
    </header>

    <section class="mailbox">
      <button class="envelope" id="envelope" type="button" aria-label="Open secret apology mail" aria-expanded="false">
        <div class="letter" id="letter">
          <article class="email-card" aria-live="polite">
            <div class="email-header">
              <div class="avatar" aria-hidden="true">🦖</div>
              <div class="email-details">
                <p><span>From:</span> sahildino</p>
                <p><span>To:</span> shreyadino</p>
                <p><span>Subject:</span> Your guilty meowdino is home safely 💌</p>
              </div>
            </div>
            <div class="divider"></div>
            <div class="message">
              <p>My love dino, 🦕💕</p>
              <p>After leaving the gym, I was going home, and in my head, I genuinely thought I had already told you. But this silly dino only thought it and forgot to actually send it to his love dino. 🥺</p>
              <p>I’m home safely now, baby, but I’m sorry I didn’t tell you earlier. I know you care about me, and I should never leave my precious dino wondering where her dino disappeared to.</p>
              <p>Please forgive your absent-minded dino? I promise I wasn’t ignoring you — I was just being a little dumb while still thinking about you. 💗</p>
              <p>And honestly… if I get a cute angry face, your anger is adorable to me. 🙈🦖</p>
              <p class="closing">I’m sorry, my love dino.<br />Your meowdino reached home safely, misses you already, and is ready for all the cuddles and scolding you want to give him. 💕</p>
              <p class="signature">With all my love,<br /><strong>sahildino</strong> 🦖</p>
            </div>
          </article>
        </div>
        <div class="envelope-back"></div>
        <div class="flap"></div>
        <div class="front-left"></div>
        <div class="front-right"></div>
        <div class="front-bottom"></div>
        <div class="seal" aria-hidden="true">💗</div>
      </button>

      <button class="action" id="action" type="button">Open my mail 💌</button>
    </section>

    <footer class="footer">Made only for shreyadino, from her meowdino 🦖💕</footer>
  </main>
</body>
</html>
